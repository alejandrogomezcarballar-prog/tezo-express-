<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezo-Express - Punto de Venta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Tezo-Express POS</h1>
        <span class="text-xs bg-green-500 px-2 py-1 rounded-full font-semibold">En línea</span>
    </header>
    <main class="flex-1 max-w-4xl w-full mx-auto p-4">
        <div class="bg-white rounded-lg shadow p-6 mb-4">
            <h2 class="text-lg font-semibold text-gray-800 mb-2">Control de Caja e Inventario</h2>
            <p class="text-gray-600 text-sm mb-4">Sistema local operando sin conexión para tu tienda tradicional.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border p-4 rounded-lg bg-gray-50">
                    <h3 class="font-bold text-gray-700 mb-2">Registrar Venta</h3>
                    <input type="text" placeholder="Código de producto o nombre" class="w-full border p-2 rounded mb-2 text-sm">
                    <button class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">Cobrar</button>
                </div>
                <div class="border p-4 rounded-lg bg-gray-50">
                    <h3 class="font-bold text-gray-700 mb-2">Estado del Sistema</h3>
                    <p class="text-sm text-gray-600">Almacenamiento local activo.</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-white border-t text-center py-3 text-xs text-gray-500">
        Tezo-Express &copy; 2026 - PWA Offline Ready
    </footer>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Error en Service Worker:', err));
            });
        }
    </script>
</body>
</html>
