    <!-- Modal para Agregar Producto -->
    <div x-show="showModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40" style="display: none;">
        <div class="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">
            <h3 class="text-lg font-bold mb-4 text-slate-800">Agregar Nuevo Producto</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Producto</label>
                    <input type="text" x-model="newProduct.name" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Precio ($)</label>
                    <input type="number" x-model.number="newProduct.price" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Stock Inicial</label>
                    <input type="number" x-model.number="newProduct.stock" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button @click="showModal = false" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-sm hover:bg-slate-50">Cancelar</button>
                <button @click="saveProduct()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700 font-semibold">Guardar</button>
            </div>

    <!-- Modal de Configuración de Tienda -->
    <div x-show="showStoreModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" style="display: none;">

            <h3 class="text-lg font-bold mb-2 text-slate-800">Configuración del Negocio</h3>
            <p class="text-xs text-slate-500 mb-4">Ingresa el nombre de la tienda. Los datos de inventario y ventas se guardarán de forma independiente para este negocio.</p>

                <div>

                    <input type="text" x-model="tempStoreName" placeholder="Ej. Abarrotes Don Pepe" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">

    <!-- Lógica de la Aplicación -->
    <script>
        function posApp() {
            return {
                activeTab: 'pos',
                search: '',
                showModal: false,
                showStoreModal: false,
                storeName: '',
                tempStoreName: '',
                products: [],
                cart: [],
                salesHistory: [],
                newProduct: { name: '', price: 0, stock: 0 },

                initApp() {
                    // 1. Revisar si viene el parámetro ?tienda= en la URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const urlStore = urlParams.get('tienda');

                    if (urlStore && urlStore.trim() !== '') {
                        this.storeName = urlStore.trim();
                        localStorage.setItem('tezo_active_store', this.storeName);
                    } else {
                        // 2. Si no viene en URL, revisar si ya había una tienda guardada en este navegador
                        const savedStore = localStorage.getItem('tezo_active_store');
                        if (savedStore) {
                            this.storeName = savedStore;
                        } else {
                            // 3. Si es dispositivo nuevo sin enlace personalizado, pedir el nombre
                            this.showStoreModal = true;
                        }
                    }

                    if (this.storeName) {
                        this.applyStoreData();
                    }
                },

                get storagePrefix() {
                    // Genera un identificador limpio por tienda (ej. tezo_abarrotes_don_pepe_)
                    const slug = (this.storeName || 'default').toLowerCase().replace(/[^a-z0-9]/g, '_');
                    return `tezo_${slug}_`;
                },

                applyStoreData() {
                    document.title = `${this.storeName} - Punto de Venta`;
                    this.products = JSON.parse(localStorage.getItem(this.storagePrefix + 'products')) || [
                        { id: 1, name: 'Refresco 600ml', price: 20, stock: 24 },
                        { id: 2, name: 'Agua Ciel 1L', price: 15, stock: 30 },
                        { id: 3, name: 'Sabritas Sal 45g', price: 18, stock: 15 },
                        { id: 4, name: 'Galletas Marías', price: 14, stock: 20 }
                    ];
                    this.salesHistory = JSON.parse(localStorage.getItem(this.storagePrefix + 'sales')) || [];
                },

                openStoreModal() {
                    this.tempStoreName = this.storeName;
                    this.showStoreModal = true;
                },

                saveStoreConfig() {
                    if (!this.tempStoreName || this.tempStoreName.trim() === '') {
                        alert('Por favor escribe el nombre de la tienda.');
                        return;
                    }
                    this.storeName = this.tempStoreName.trim();
                    localStorage.setItem('tezo_active_store', this.storeName);
                    this.applyStoreData();
                    this.showStoreModal = false;
                },

                get filteredProducts() {
                    if (!this.search) return this.products;
                    return this.products.filter(p => p.name.toLowerCase().includes(this.search.toLowerCase()));
                },

                get totalCart() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                },

                get totalSalesSum() {
                    return this.salesHistory.reduce((sum, sale) => sum + sale.total, 0);
                },

                addToCart(product) {
                    if (product.stock <= 0) {
                        alert('Producto sin stock disponible');
                        return;
                    }
                    let existing = this.cart.find(item => item.id === product.id);
                    if (existing) {
                        if (existing.quantity < product.stock) {
                            existing.quantity++;
                        } else {
                            alert('No hay más stock disponible');
                        }
                    } else {
                        this.cart.push({ ...product, quantity: 1 });
                    }
                },

                removeFromCart(index) {
                    this.cart.splice(index, 1);
                },

                checkout() {
                    this.cart.forEach(cartItem => {
                        let prod = this.products.find(p => p.id === cartItem.id);
                        if (prod) prod.stock -= cartItem.quantity;
                    });

                    const sale = {
                        id: 'T-' + Date.now().toString().slice(-6),
                        date: new Date().toLocaleString(),
                        itemsCount: this.cart.reduce((sum, i) => sum + i.quantity, 0),
                        total: this.totalCart
                    };
                    this.salesHistory.unshift(sale);

                    this.saveData();
                    this.cart = [];
                    alert('¡Venta realizada con éxito!');
                },

                openProductModal() {
                    this.newProduct = { name: '', price: 0, stock: 0 };
                    this.showModal = true;
                },

                saveProduct() {
                    if (!this.newProduct.name || this.newProduct.price <= 0) {
                        alert('Por favor ingresa un nombre y precio válidos.');
                        return;
                    }
                    this.products.push({
                        id: Date.now(),
                        name: this.newProduct.name,
                        price: Number(this.newProduct.price),
                        stock: Number(this.newProduct.stock)
                    });
                    this.saveData();
                    this.showModal = false;
                },

                deleteProduct(id) {
                    if (confirm('¿Estás seguro de eliminar este producto?')) {
                        this.products = this.products.filter(p => p.id !== id);
                        this.saveData();
                    }
                },

                exportInventoryCSV() {
                    let csv = `Tienda: ${this.storeName}\nID,Producto,Precio,Stock\n`;
                    this.products.forEach(p => {
                        csv += `${p.id},"${p.name}",${p.price},${p.stock}\n`;
                    .
